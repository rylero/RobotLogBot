# Portainer: Stacks → Add stack → Web editor (or Repository for this file only).
# Pulls a pre-built image from GHCR — no build on the closet box.
# No published ports — Discord/Anthropic outbound only.

services:
  robotlogbot:
    image: ghcr.io/rylero/robotlogbot:latest
    container_name: robotlogbot
    restart: unless-stopped
    pull_policy: always
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-6}
      ALLOWED_CHANNEL_IDS: ${ALLOWED_CHANNEL_IDS:-}
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS:-}
      LOG_DIR: /data/logs
      CHIEFDELPHI_MCP_CWD: /app/vendor/chiefdelphi-mcp
      CLAUDESCOPE_BIN: /usr/local/bin/ClaudeScope
      GITHUB_MCP_BIN: /usr/local/bin/github-mcp-server
      # Fine-grained PAT with Contents: Read on the robot repo(s)
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      GITHUB_DEFAULT_REPO: ${GITHUB_DEFAULT_REPO:-}
      GITHUB_MCP_READ_ONLY: ${GITHUB_MCP_READ_ONLY:-true}
      GITHUB_MCP_TOOLSETS: ${GITHUB_MCP_TOOLSETS:-repos,pull_requests,issues,git,context}
    volumes:
      # Absolute path on the Docker host (rclone sync target)
      - ${HOST_LOG_DIR}:/data/logs:ro
      - chiefdelphi-data:/app/vendor/chiefdelphi-mcp/data
      - bot-data:/app/data

volumes:
  chiefdelphi-data:
  bot-data:
