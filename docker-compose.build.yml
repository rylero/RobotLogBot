# Optional: build locally instead of pulling GHCR
services:
  robotlogbot:
    build:
      context: .
      args:
        CLAUDESCOPE_VERSION: v1.2.1
        CHIEFDELPHI_REF: main
    image: robotlogbot:local
    container_name: robotlogbot
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-6}
      ALLOWED_CHANNEL_IDS: ${ALLOWED_CHANNEL_IDS:-}
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS:-}
      LOG_DIR: /data/logs
      CHIEFDELPHI_MCP_CWD: /app/vendor/chiefdelphi-mcp
      CLAUDESCOPE_BIN: /usr/local/bin/ClaudeScope
    volumes:
      - ${HOST_LOG_DIR}:/data/logs:ro
      - chiefdelphi-data:/app/vendor/chiefdelphi-mcp/data
      - bot-data:/app/data

volumes:
  chiefdelphi-data:
  bot-data:
